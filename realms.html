<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outworlders - The Realms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        header {
            background-image: url('Page Graphics/bannerT.png');
            background-repeat: repeat;
            background-position: center;
            background-color: #2a2a2a;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .home-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        
        .home-btn img {
            height: 40px;
            width: auto;
        }
        
        .home-btn:hover {
            opacity: 0.8;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .map-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }
        
        .solar-system {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 600px;
        }
        
        .celestial-body {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            transform-origin: center;
        }
        
        .celestial-body:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
            z-index: 10;
        }
        
        .celestial-body.active {
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 1));
            z-index: 100;
        }
        
        .celestial-body img {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Sky Father - gas giant */
        #sky-father {
            width: 200px;
            height: 200px;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Inner Ring */
        #inner-ring {
            width: 300px;
            height: auto;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }
        
        #inner-ring-clickable {
            width: 300px;
            height: 60px;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        
        #inner-ring-clickable:hover {
            border-color: rgba(255, 255, 255, 0.6);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }
        
        /* Tz-Gol and Yub'nisk - horseshoe orbit, same position */
        #tz-gol {
            width: 55px;
            height: 55px;
            left: 400px;
            top: calc(50% - 40px);
        }
        
        #yubnisk {
            width: 50px;
            height: 50px;
            left: 403px;
            top: calc(50% + 25px);
        }
        
        /* Naagard */
        #naagard {
            width: 80px;
            height: 80px;
            left: 520px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Navienna's Tears - outer ring */
        #naviennas-tears {
            width: 350px;
            height: auto;
            left: 640px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }
        
        #naviennas-tears-clickable {
            width: 350px;
            height: 70px;
            left: 640px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        
        #naviennas-tears-clickable:hover {
            border-color: rgba(255, 255, 255, 0.6);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }
        
        /* Midgard */
        #midgard {
            width: 75px;
            height: 75px;
            left: 1020px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Fernguard */
        #fernguard {
            width: 65px;
            height: 65px;
            left: 1140px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Sigil */
        #sigil {
            width: 50px;
            height: auto;
            left: 1250px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Nameless Moon */
        #nameless-moon {
            width: 45px;
            height: 45px;
            left: 1350px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Info Panel */
        .info-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(42, 42, 42, 0.98);
            border: 3px solid #555;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
        
        .info-panel.active {
            display: block;
        }
        
        .info-panel h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .detail-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin: 20px auto;
            display: block;
            border: 2px solid #555;
            border-radius: 10px;
        }
        
        .info-panel p {
            line-height: 1.8;
            margin-bottom: 15px;
            color: #ddd;
        }
        
        .info-panel strong {
            color: #fff;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #555;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .close-btn:hover {
            background-color: #777;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 999;
        }
        
        .overlay.active {
            display: block;
        }
        
        footer {
            background-image: url('Page Graphics/bannerB.png');
            background-repeat: repeat;
            background-position: center;
            background-color: #2a2a2a;
            padding: 20px;
            text-align: center;
        }
        
        @media (max-width: 1200px) {
            .solar-system {
                transform: scale(0.7);
                transform-origin: left center;
            }
        }
        
        @media (max-width: 800px) {
            .solar-system {
                transform: scale(0.5);
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">
            <img src="Page Graphics/home.png" alt="Home">
        </a>
        <h1>The Realms</h1>
        <p>Explore the Material Plane</p>
    </header>
    
    <div class="map-container">
        <div class="solar-system">
            <!-- Sky Father -->
            <div id="sky-father" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/skyFather.png" alt="Sky Father">
            </div>
            
            <!-- Inner Ring (visual) -->
            <div id="inner-ring" style="pointer-events: none;">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/innerRing.png" alt="Inner Ring">
            </div>
            
            <!-- Inner Ring (clickable area) -->
            <div id="inner-ring-clickable" class="celestial-body"></div>
            
            <!-- Tz-Gol (top) -->
            <div id="tz-gol" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/tzGol.png" alt="Tz-Gol">
            </div>
            
            <!-- Yub'nisk (bottom) -->
            <div id="yubnisk" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/yubNisk.png" alt="Yub'nisk">
            </div>
            
            <!-- Naagard -->
            <div id="naagard" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/Naagard.png" alt="Naagard">
            </div>
            
            <!-- Navienna's Tears (visual) -->
            <div id="naviennas-tears" style="pointer-events: none;">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/naviennasTears.png" alt="Navienna's Tears">
            </div>
            
            <!-- Navienna's Tears (clickable area) -->
            <div id="naviennas-tears-clickable" class="celestial-body"></div>
            
            <!-- Midgard -->
            <div id="midgard" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/Midgard.png" alt="Midgard">
            </div>
            
            <!-- Fernguard -->
            <div id="fernguard" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/Ferngard.png" alt="Fernguard">
            </div>
            
            <!-- Sigil -->
            <div id="sigil" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/Sigil.png" alt="Sigil">
            </div>
            
            <!-- Nameless Moon -->
            <div id="nameless-moon" class="celestial-body">
                <img src="Page Graphics/Wiki/Interactive Realms System Map/namelessMoon.png" alt="Nameless Moon">
            </div>
        </div>
    </div>
    
    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>
    
    <!-- Info Panel -->
    <div class="info-panel" id="info-panel">
        <button class="close-btn" id="close-btn">âœ•</button>
        <div id="info-content"></div>
    </div>
    
    <footer>
        <p>&copy; 2025 Outworlders. All rights reserved.</p>
    </footer>
    
    <script>
        // Celestial body data
        const celestialData = {
            'sky-father': {
                name: 'The Sky Father',
                image: 'Page Graphics/Wiki/Interactive Realms System Map/skyFatherL.png',
                description: `<p>The gas giant around which all the Realms orbit. It has three major storms known as the "Eyes of the Father," which are central to the myths and spiritual beliefs of every culture across the Realms.</p>
                <p><strong>Features:</strong> Prominent rings and ring arcs. Home to air elementals, bizarre Aberrations, and several mad wizards and liches who built floating castles amid the eternal storms.</p>
                <p><strong>Secret:</strong> The Sky Father acts as the prison of the Original Enigmatic Creator, bound at its heart during the events that sparked the God Wars.</p>`
            },
            'inner-ring-clickable': {
                name: "The Father's Girdle",
                image: 'Page Graphics/Wiki/Interactive Realms System Map/innerRingL.png',
                description: `<p>A scattered ring of ice, metal, and stone orbiting close to the Sky Father.</p>
                <p><strong>Legend:</strong> Said to be the countless bodies of primordial monsters that the Sky Father slew to establish the Realms. There may be something to these legends.</p>`
            },
            'tz-gol': {
                name: 'Tz-Gol (Realm of Fire)',
                image: 'Page Graphics/Wiki/Interactive Realms System Map/tzGolL.png',
                description: `<p>Home of the enigmatic Stoneborn. This volcanic realm shares a horseshoe orbit with the ruined goblin world of Yub'nisk.</p>
                <p><strong>Access:</strong> Visitors are forbidden except in one trade cityâ€”the Brazen Citadel. Trespassing anywhere else carries a death penalty.</p>
                <p><strong>Culture:</strong> The Stoneborn are deeply xenophobic and call their world "The Creator's Kiln." They work as mercenaries and master craftsmen when away from home.</p>`
            },
            'yubnisk': {
                name: "Yub'nisk",
                image: 'Page Graphics/Wiki/Interactive Realms System Map/yubNiskL.png',
                description: `<p>A barren, bombarded world of hard rock and acid oceans. Once the home of the goblins, the surface was devastated long before the God Wars began.</p>
                <p><strong>History Lost:</strong> Virtually no history is known, as the goblins destroyed their own records as soon as their Tyrant God, Ulthrag, shackled them to his will.</p>
                <p><strong>Current State:</strong> Shares a horseshoe orbit with Tz-Gol. The surface is uninhabitable, a testament to the destructive power of divine tyranny.</p>`
            },
            'naagard': {
                name: 'Naagard',
                image: 'Page Graphics/Wiki/Interactive Realms System Map/NaagardL.png',
                description: `<p>A hot world of riotous jungle and scorched desert, 80% covered in mostly shallow oceans.</p>
                <p><strong>Inhabitants:</strong> Numerous warring kingdoms dominated by Lizardfolk, Kobolds, and other reptilian humanoids. Pirates and sea peoples abound.</p>
                <p><strong>Ruins:</strong> Plenty of ancient ruins from the God Wars wait to be explored by brave adventurers.</p>`
            },
            'naviennas-tears-clickable': {
                name: "Navienna's Tears",
                image: 'Page Graphics/Wiki/Interactive Realms System Map/naviennasTearsL.png',
                description: `<p>A glittering ring of debris visible in the night sky from all the Realms.</p>
                <p><strong>Origin:</strong> The remnants of a third moon utterly destroyed in the final hours of the God Wars.</p>
                <p><strong>Legend:</strong> Named for the tears shed by the goddess Navienna when she beheld the ruin and devastation wrought by the God Wars.</p>`
            },
            'midgard': {
                name: 'Midgard',
                image: 'Page Graphics/Wiki/Interactive Realms System Map/MidgardL.png',
                description: `<p>Besides the long days and nights, Midgard has a climate very similar to Earth.</p>
                <p><strong>Major Power:</strong> Largely dominated by the Holy Pallindros Empire, founded by followers of the god Kavren during the God Wars. The imperial core is insulated but decaying, while the frontier remains dangerous.</p>
                <p><strong>Threats:</strong> Rampaging goblinoid hordes plague the less productive lands. Regional conflicts arise from widening cracks in imperial unity.</p>`
            },
            'fernguard': {
                name: 'Fernguard',
                image: 'Page Graphics/Wiki/Interactive Realms System Map/FerngardL.png',
                description: `<p>Supposedly the outermost habitable Realm, easily accessible by teleportation magics.</p>
                <p><strong>Climate:</strong> A thin band of habitable lands around the equator. The poles are so cold that most mortals cannot survive without special protections.</p>
                <p><strong>Inhabitants:</strong> Demographically dominated by mammalian humanoids. Enigmatic elf clans dominate the frozen north and south where few others can survive. Food is scarce and life is hardâ€”unless you're an elf.</p>`
            },
            'sigil': {
                name: 'Sigil',
                image: 'Page Graphics/Wiki/Interactive Realms System Map/SigilL.png',
                description: `<p>An artificial world in the shape of a torus, owned by the Priesthood of Fortuna.</p>
                <p><strong>Purpose:</strong> Eternal neutral ground and home of the international bank and adventuring guild (The Guild).</p>
                <p><strong>Power:</strong> Maintains neutrality through control of the Realms' reserve currency (Solarii) and by acting as a trusted means of lawful exchange between factions.</p>`
            },
            'nameless-moon': {
                name: 'The Nameless Moon',
                image: 'Page Graphics/Wiki/Interactive Realms System Map/namelessMoonL.png',
                description: `<p>The actual outermost moonâ€”a well-kept secret that Fernguard isn't truly the edge of the Realms.</p>
                <p><strong>Mystery:</strong> Little is known about this remote world. Possible theories include:</p>
                <ul>
                    <li>A dumping ground for the Gods' imperfect creations</li>
                    <li>A prison for surviving primordial beings</li>
                    <li>A world of such extremes that no mortal can survive there</li>
                </ul>
                <p><strong>Warning:</strong> Few who venture here return to tell the tale.</p>`
            }
        };
        
        // Elements
        const overlay = document.getElementById('overlay');
        const infoPanel = document.getElementById('info-panel');
        const infoContent = document.getElementById('info-content');
        const closeBtn = document.getElementById('close-btn');
        const celestialBodies = document.querySelectorAll('.celestial-body');
        
        // Click handlers
        celestialBodies.forEach(body => {
            body.addEventListener('click', function() {
                const bodyId = this.id;
                const data = celestialData[bodyId];
                
                if (data) {
                    let imageHTML = '';
                    if (data.image) {
                        imageHTML = `<img src="${data.image}" alt="${data.name}" class="detail-image">`;
                    }
                    
                    infoContent.innerHTML = `<h2>${data.name}</h2>${imageHTML}${data.description}`;
                    overlay.classList.add('active');
                    infoPanel.classList.add('active');
                    this.classList.add('active');
                }
            });
        });
        
        // Close handlers
        function closePanel() {
            overlay.classList.remove('active');
            infoPanel.classList.remove('active');
            celestialBodies.forEach(body => body.classList.remove('active'));
        }
        
        closeBtn.addEventListener('click', closePanel);
        overlay.addEventListener('click', closePanel);
        
        // Keyboard support (ESC to close)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && infoPanel.classList.contains('active')) {
                closePanel();
            }
        });
    </script>
</body>
</html>
