<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outworlders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            background-image: url('bannerT.png');
            background-repeat: repeat;
            background-position: center;
            background-color: #2a2a2a;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .home-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        
        .home-btn img {
            height: 40px;
            width: auto;
        }
        
        .home-btn:hover {
            opacity: 0.8;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .comic-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        
        .comic-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 100%;
        }
        
        .nav-side {
            display: flex;
            flex-direction: row;
            gap: 15px;
        }
        
        #comic-image {
            max-width: 100%;
            width: auto;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            border: 2px solid #444;
        }
        
        #comic-image.loading {
            min-height: 400px;
            background: #2a2a2a;
        }
        
        .controls {
            background-image: url('bannerB.png');
            background-repeat: repeat;
            background-position: center;
            background-color: #2a2a2a;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        
        .controls .page-info {
            grid-column: 2;
            justify-self: center;
        }
        
        .controls select {
            grid-column: 3;
            justify-self: end;
        }
        
        button {
            background-color: transparent;
            color: #fff;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        button img {
            height: 50px;
            width: auto;
            display: block;
        }
        
        button:hover:not(:disabled) {
            opacity: 0.8;
        }
        
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        select {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        select:hover {
            background-color: #555;
        }
        
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .page-info {
            font-size: 18px;
            padding: 12px 20px;
            background-color: #333;
            border-radius: 5px;
        }
        
        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            
            button img {
                height: 35px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .comic-wrapper {
                flex-direction: column;
            }
            
            .nav-side {
                flex-direction: row;
            }
            
            .controls select {
                margin-left: 0;
                grid-column: auto;
                justify-self: auto;
            }
            
            .controls {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">
            <img src="home.png" alt="Home">
        </a>
        <h1>Outworlders</h1>
        <p>A Webcomic</p>
    </header>
    
    <div class="comic-container">
        <div class="comic-wrapper">
            <div class="nav-side">
                <button id="first-btn"><img src="first.png" alt="First"></button>
                <button id="prev-btn"><img src="previous.png" alt="Previous"></button>
            </div>
            
            <img id="comic-image" src="" alt="Comic page">
            
            <div class="nav-side">
                <button id="next-btn"><img src="next.png" alt="Next"></button>
                <button id="last-btn"><img src="last.png" alt="Last"></button>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <div class="page-info">
            Page <span id="current-page">1</span> / <span id="total-pages">...</span>
        </div>
        <select id="page-select">
            <option value="">Jump to page...</option>
        </select>
    </div>
    
    <script>
        // CONFIGURATION
        const PAGE_LIST_FILE = 'pageNames.txt';
        
        // State
        let comics = [];
        let currentIndex = 0;
        let imageCache = new Map();
        
        // Elements
        const comicImage = document.getElementById('comic-image');
        const currentPageSpan = document.getElementById('current-page');
        const totalPagesSpan = document.getElementById('total-pages');
        const firstBtn = document.getElementById('first-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const lastBtn = document.getElementById('last-btn');
        const pageSelect = document.getElementById('page-select');
        
        // Load page names from text file
        async function loadPageNames() {
            try {
                const response = await fetch(PAGE_LIST_FILE);
                if (!response.ok) {
                    throw new Error(`Failed to load ${PAGE_LIST_FILE}`);
                }
                
                const text = await response.text();
                const lines = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0);
                
                if (lines.length === 0) {
                    throw new Error('No page names found in file');
                }
                
                comics = lines;
                populateDropdown();
                updateComic();
                
            } catch (error) {
                console.error('Error loading page names:', error);
                comicImage.alt = `Error: Could not load ${PAGE_LIST_FILE}. Make sure the file exists and contains page names.`;
                totalPagesSpan.textContent = 'Error';
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = `Failed to load ${PAGE_LIST_FILE}. Please ensure the file exists in the same directory.`;
                document.querySelector('.comic-container').prepend(errorDiv);
            }
        }
        
        // Preload adjacent images
        function preloadAdjacentImages() {
            if (comics.length === 0) return;
            
            // Preload next image
            if (currentIndex + 1 < comics.length) {
                const nextSrc = comics[currentIndex + 1];
                if (!imageCache.has(nextSrc)) {
                    const img = new Image();
                    img.src = nextSrc;
                    imageCache.set(nextSrc, img);
                }
            }
            
            // Preload previous image
            if (currentIndex - 1 >= 0) {
                const prevSrc = comics[currentIndex - 1];
                if (!imageCache.has(prevSrc)) {
                    const img = new Image();
                    img.src = prevSrc;
                    imageCache.set(prevSrc, img);
                }
            }
        }
        
        // Populate dropdown
        function populateDropdown() {
            pageSelect.innerHTML = '<option value="">Jump to page...</option>';
            
            comics.forEach((filename, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `Page ${index + 1} (${filename})`;
                pageSelect.appendChild(option);
            });
            
            pageSelect.disabled = false;
        }
        
        // Update comic display
        function updateComic() {
            if (comics.length === 0) return;
            
            comicImage.src = comics[currentIndex];
            currentPageSpan.textContent = currentIndex + 1;
            totalPagesSpan.textContent = comics.length;
            pageSelect.value = currentIndex;
            
            // Update button states
            firstBtn.disabled = currentIndex === 0;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex >= comics.length - 1;
            lastBtn.disabled = currentIndex >= comics.length - 1;
            
            // Preload adjacent pages
            preloadAdjacentImages();
        }
        
        // Event listeners
        firstBtn.addEventListener('click', () => {
            currentIndex = 0;
            updateComic();
        });
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateComic();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentIndex < comics.length - 1) {
                currentIndex++;
                updateComic();
            }
        });
        
        lastBtn.addEventListener('click', () => {
            currentIndex = comics.length - 1;
            updateComic();
        });
        
        pageSelect.addEventListener('change', (e) => {
            const selectedIndex = parseInt(e.target.value);
            if (!isNaN(selectedIndex) && selectedIndex >= 0 && selectedIndex < comics.length) {
                currentIndex = selectedIndex;
                updateComic();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                prevBtn.click();
            }
            if (e.key === 'ArrowRight' && currentIndex < comics.length - 1) {
                nextBtn.click();
            }
        });
        
        // Initialize - load page names from text file
        loadPageNames();
    </script>
</body>
</html>
