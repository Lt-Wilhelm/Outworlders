<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outworlders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            background-image: url('Page Graphics/bannerT.png');
            background-repeat: repeat;
            background-position: center;
            background-color: #2a2a2a;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .splash-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            gap: 40px;
        }
        
        .logo-container {
            max-width: 600px;
            width: 100%;
        }
        
        .logo-container img {
            width: 100%;
            height: auto;
        }
        
        .nav-buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-buttons a {
            text-decoration: none;
        }
        
        .nav-buttons button {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            transition: background-color 0.3s;
            min-width: 200px;
        }
        
        .nav-buttons button:hover {
            background-color: #555;
        }
        
        footer {
            background-image: url('Page Graphics/bannerB.png');
            background-repeat: repeat;
            background-position: center;
            background-color: #2a2a2a;
            padding: 20px;
            text-align: center;
            min-height: 80px;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .nav-buttons button {
                padding: 15px 30px;
                font-size: 18px;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Outworlders</h1>
        <p>A Webcomic</p>
    </header>
    
    <div class="splash-container">
        <div class="logo-container">
            <img src="Page Graphics/logo.png" alt="Outworlders Logo">
        </div>
        
        <div class="nav-buttons">
            <a href="comic.html">
                <button>Read Comic</button>
            </a>
            <a href="blog.html">
                <button>Blog</button>
            </a>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2024 Outworlders. All rights reserved.</p>
    </footer>
</body>
</html>
